name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-content:
    name: Validate Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python tools
        run: pip install yamllint jsonschema

      - name: YAML lint
        run: yamllint -d relaxed .

      - name: Validate .brl level files
        run: python tools/validate_brl.py

      - name: Check for secrets in tracked files
        run: python tools/check_secrets.py

  scan-secrets:
    name: Scan Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git --verbose --redact --no-banner

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [validate-content, scan-secrets]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binaries and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: godot-4_3-linux-${{ hashFiles('project.godot') }}

      - name: Install Godot 4.3 headless
        run: ./tools/install_godot_linux.sh

      - name: Run smoke tests
        run: >
          ./bin/godot --headless -s res://tests/smoke/run_smoke_tests.gd
          2>&1 | tee smoke_output.txt

      - name: Assert SMOKE_OK in output
        run: grep -q "SMOKE_OK" smoke_output.txt

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke_output.txt
          retention-days: 7

  export-android:
    name: Export Android Debug APK
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: godot-4_3-linux-${{ hashFiles('project.godot') }}

      - name: Install Godot 4.3 headless
        run: ./tools/install_godot_linux.sh

      - name: Install Android SDK
        run: ./tools/install_android_sdk.sh

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          ./bin/godot --headless --export-debug "Android" \
            build/android/BubbleReefRush-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-reef-rush-android-debug
          path: build/android/BubbleReefRush-debug.apk
          retention-days: 7
